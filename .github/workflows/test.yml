name: build-test

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS / build + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU make
        run: brew install make
      - name: Build fat APE on macOS
        run: bash ./build.sh
      - name: Test macOS backend
        run: chmod +x sysperm.exe tests/macos.sh && BIN=./sysperm.exe bash ./tests/macos.sh

  windows:
    name: Windows / WSL build + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu WSL
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: make unzip tar curl coreutils binutils
      - name: Build fat APE in WSL
        shell: wsl-bash {0}
        run: bash ./build.sh
      - name: Test Windows backend
        shell: pwsh
        run: |
          $env:BIN = (Resolve-Path .\sysperm.exe)
          .\tests\windows.ps1

  linux:
    name: Linux / build + host + distro families
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu test dependencies
        run: sudo apt-get update && sudo apt-get install -y acl passwd sudo libc-bin bash
      - name: Build fat APE on Linux
        run: bash ./build.sh
      - name: Test Ubuntu runner backend
        run: chmod +x sysperm.exe tests/linux.sh && BIN=./sysperm.exe bash ./tests/linux.sh
      - name: Test Linux distro families with Docker
        run: chmod +x tests/linux-docker.sh && bash ./tests/linux-docker.sh
      - name: Create or update tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" sysperm.exe --clobber
